[telemedicine]
# Ubuntu 26.04 ships sudo-rs, whose password prompt Ansible does not recognise; sudo.ws is the classic sudo.
# Remove ansible_become_exe on machines that do not have /usr/bin/sudo.ws.
localhost ansible_connection=local ansible_become_exe=/usr/bin/sudo.ws

# Remote Ubuntu EC2 example: comment out localhost above, then use your own IP and key path.
# ec2-app ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/telemedicine.pem
